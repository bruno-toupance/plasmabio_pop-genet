name: plasmabio_pop-genet

channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:

  # Jupyter dependencies
  - jupyterhub>=4.1,<5
  - jupyterlab>=4.0,<5
  - notebook>=7,<8
  - jupyter_server>=2,<3
  - jupyter-server-proxy>=4.1,<4.2
  - jupyter-resource-usage
  - jupyterlab-topbar-text

  # Jupyter archive
  # https://github.com/jupyterlab-contrib/jupyter-archive
  - jupyter-archive=3.3.4
  
  # JupyterLab git
  # https://github.com/jupyterlab/jupyterlab-git
  - jupyterlab-git

  - nodejs

  
  # Bash environment
  - bash_kernel

  # RStudio integration 
  # - rstudio
  - jupyter-rsession-proxy>=2.3,<3

  # Python environment
  - python>=3.10,<3.13
  - pip
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.3.1
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - statsmodels=0.14.5
  - pyarrow=20.*
  - pybedtools=0.11.0
  - pysam=0.22.1
  - rpy2=3.6.4
  - scikit-allel=1.3.8
  - statannotations>=0.4.2
  

  # R environment
  - r-base
  - r-irkernel
  - gsl>=2.7,<2.8


  # Population Genomics
  - vcftools
  - bcftools
  - bedtools
  - htslib
  - samtools
  - tabix
  - selscan
  - plink
  - plink2
  - admixture
  - admixtools

  # Population genetics simulations
  - slim
  - fastsimcoal2

  # Additional Python packages
  - pip:
    - watermark
